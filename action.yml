name: 'Install NSIS'
description: 'Installs NSIS including the EnvVar plugin (only supported on Windows)'
author: 'repolevedavaj'
branding:
  icon: 'package'
  color: 'gray-dark'
runs:
  using: "composite"
  steps:
    - name: Install NSIS
      run: |
        Invoke-WebRequest "https://onboardcloud.dl.sourceforge.net/project/nsis/NSIS 3/3.11/nsis-3.11-setup.exe?viasf=1&fid=313eddb57b5853c6" -OutFile C:\WINDOWS\Temp\nsis-3.11-setup.exe
        $process = Start-Process "C:\WINDOWS\Temp\nsis-3.11-setup.exe" -ArgumentList "/S" -Wait -PassThru
        $exitCode = $process.ExitCode
          if ($exitCode -eq 0) {
              Write-Host "Installer ran successfully."
          } else {
              Write-Host "Installer failed with exit code $exitCode."
              exit $exitCode
          }
        echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append
        echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath "$env:GITHUB_PATH" -Append
      shell: pwsh
